name: access-controller
description: "An edge controller. Decides taps against a read-only mirror of ACC_POLICY, writes its own status into ACC_STATUS, publishes events and heartbeats, takes commands. It cannot write policy."
publish_permissions:
  - "acc.*.evt.>"
  - "acc.*.heartbeat.>"
  - "$KV.ACC_STATUS.>"
  - "_INBOX.>"
  - "$JS.API.INFO"
  - "$JS.API.STREAM.INFO.KV_ACC_POLICY"
  - "$JS.API.CONSUMER.CREATE.KV_ACC_POLICY"
  - "$JS.API.CONSUMER.CREATE.KV_ACC_POLICY.>"
  - "$JS.API.CONSUMER.DELETE.KV_ACC_POLICY.>"
  - "$JS.API.DIRECT.GET.KV_ACC_POLICY.>"
  - "$JS.FC.KV_ACC_POLICY.>"
  - "$JS.API.STREAM.INFO.KV_ACC_STATUS"
  - "$JS.API.CONSUMER.CREATE.KV_ACC_STATUS"
  - "$JS.API.CONSUMER.CREATE.KV_ACC_STATUS.>"
  - "$JS.API.CONSUMER.DELETE.KV_ACC_STATUS.>"
  - "$JS.API.DIRECT.GET.KV_ACC_STATUS.>"
  - "$JS.FC.KV_ACC_STATUS.>"
subscribe_permissions:
  - "acc.*.cmd.>"
  - "acc.*.tap.>"
  - "acc.*.evt.fire"
  - "_INBOX.>"
  - "$SRV.>"
