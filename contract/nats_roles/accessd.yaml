name: accessd
description: "accessd, the central server. Owns ACC_EVENTS and the ACC_POLICY and ACC_STATUS buckets, writes policy, issues commands to controllers and consumes their events."
publish_permissions:
  - "acc.*.cmd.>"
  - "acc.*.evt.>"
  - "$KV.ACC_POLICY.>"
  - "_INBOX.>"
  - "$JS.API.INFO"
  - "$JS.API.STREAM.*.ACC_EVENTS"
  - "$JS.API.STREAM.MSG.GET.ACC_EVENTS"
  - "$JS.API.CONSUMER.*.ACC_EVENTS"
  - "$JS.API.CONSUMER.*.ACC_EVENTS.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.ACC_EVENTS.>"
  - "$JS.API.CONSUMER.MSG.NEXT.ACC_EVENTS.>"
  - "$JS.API.DIRECT.GET.ACC_EVENTS.>"
  - "$JS.ACK.ACC_EVENTS.>"
  - "$JS.FC.ACC_EVENTS.>"
  - "$JS.API.STREAM.*.KV_ACC_POLICY"
  - "$JS.API.STREAM.MSG.GET.KV_ACC_POLICY"
  - "$JS.API.CONSUMER.*.KV_ACC_POLICY"
  - "$JS.API.CONSUMER.*.KV_ACC_POLICY.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.KV_ACC_POLICY.>"
  - "$JS.API.CONSUMER.MSG.NEXT.KV_ACC_POLICY.>"
  - "$JS.API.DIRECT.GET.KV_ACC_POLICY.>"
  - "$JS.ACK.KV_ACC_POLICY.>"
  - "$JS.FC.KV_ACC_POLICY.>"
  - "$JS.API.STREAM.*.KV_ACC_STATUS"
  - "$JS.API.STREAM.MSG.GET.KV_ACC_STATUS"
  - "$JS.API.CONSUMER.*.KV_ACC_STATUS"
  - "$JS.API.CONSUMER.*.KV_ACC_STATUS.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.KV_ACC_STATUS.>"
  - "$JS.API.CONSUMER.MSG.NEXT.KV_ACC_STATUS.>"
  - "$JS.API.DIRECT.GET.KV_ACC_STATUS.>"
  - "$JS.ACK.KV_ACC_STATUS.>"
  - "$JS.FC.KV_ACC_STATUS.>"
subscribe_permissions:
  - "acc.*.heartbeat.>"
  - "_INBOX.>"
  - "$SRV.>"
