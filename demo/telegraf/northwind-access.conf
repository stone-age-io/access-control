# =============================================================================
# Northwind Traders — access events -> VictoriaMetrics
# =============================================================================
# Telegraf subscribes to the `acc.>` event subtree that running
# `access-controller` processes emit while `demo/rules/northwind-access.yaml`
# drives the estate, turns each event into a time series, and writes it to
# VictoriaMetrics over InfluxDB line protocol.
#
# VictoriaMetrics is LONG-TERM STORAGE and nothing else. Alarms already have a
# home: the controllers decide locally and accessd's sweep flips a box offline
# after 45s, both of which keep working when the site is islanded. Nothing here
# decides anything — it remembers.
#
# Demo tooling. Nothing here ships in a binary.
#
# WHY THIS EXISTS WHEN THE APP ALREADY SERVES /metrics. accessd and every
# controller already expose Prometheus (`access_decisions_total`,
# `controller_heartbeats_received_total`, …) — point VictoriaMetrics'
# `-promscrape.config` straight at those, do NOT proxy them through Telegraf.
# What those series cannot tell you is WHERE: `access_decisions_total` is
# labelled by allow and reason only, and `controller_heartbeats_received_total`
# by status only. Neither carries a site, a portal or a controller code, because
# putting one there would give every accessd deployment a label set the size of
# its customer's estate. The bus does carry it — it is in the subject — so this
# file is how "which door, which site, which box" becomes queryable without
# changing a single label in the Go code.
#
# ONE INPUT, ONE CONNECTION — THIS IS NOT A STYLE CHOICE.
# Every [[inputs.nats_consumer]] opens its OWN NATS connection. This file used to
# have one input per event kind, which read beautifully and asked for four
# connections to carry four subscriptions. The platform's default account limit
# is 10 connections (`nats.default_limits.max_connections`), and the Northwind
# demo account is already carrying rule-router, four access-controllers and
# accessd — so it failed on startup with
#
#   nats: maximum account active connections exceeded
#
# A NATS connection multiplexes any number of subscriptions. Use one, list the
# subjects, and let `event_kind` sort out what each message is. If you add a
# subject, add it to the list — do NOT add a second input.
#
# THE CREDENTIAL SHOULD BE READ-ONLY. accessd needs `console-operator` because it
# creates buckets and streams; rule-router needs it because it publishes taps.
# Telegraf only subscribes, so it wants `console-readonly` — the platform's demo
# seed puts that role on `audit@northwind.example` (viewer) as the NATS user
# `console-audit`. This is the SAME account and the SAME creds file the
# platform's `demo/telegraf/northwind.conf` uses, because both apps live in the
# Northwind account. On a plain dev nats-server with no auth, drop the
# `credentials` line.
#
# ONE MEASUREMENT, SLICED BY `event_kind`. Everything lands as `access` with a
# constant field `count`, so there is exactly one metric — `access_count` — and
# the event kind is a label:
#   count_over_time(access_count{event_kind="tap"}[5m])                  taps
#   count_over_time(access_count{event_kind="tap", allow="false"}[5m])   denials
#   sum by (reason) (count_over_time(access_count{event_kind="tap"}[1h])) breakdown
#   count_over_time(access_count{event_kind="heartbeat",
#                                thing="ctrl-kc-dc1-1"}[1m]) < 3         a quiet box
# The reason codes are whatever `policy.Decide` actually produced, so editing an
# access group in the console changes these graphs.
#
# TIMESTAMPS: ARRIVAL TIME, ON PURPOSE — the opposite of the platform config.
# Every event carries `ts` as RFC3339 at SECOND granularity. These are event
# counts, not samples: two taps at the same door in the same second with the same
# reason would land on an identical timestamp and label set, and one of them
# would be lost. Telegraf's own receive time is nanosecond-precise and cannot
# collide (agent `precision` is explicitly NOT applied to service inputs), and
# rule-router publishes live so the two differ by milliseconds.
#
# CARDINALITY: NEVER TAG BY CARDHOLDER. `cred` and `user` are on every tap event
# and are deliberately absent below. In this demo that is twelve cards; in a real
# building it is one series per badge holder per door per reason, forever, and it
# puts staff names in a monitoring system that has no access control of its own.
# Who badged where is an AUDIT question — it is already in ACC_EVENTS and on the
# Events screen, which are the surfaces built to answer it. Metrics answer rate
# and trend questions. Keep the two apart.
#
# WHAT IS DELIBERATELY NOT COLLECTED
#   - `acc.*.*.*.tap` (the raw presentation) — counting it as well as `evt.tap`
#     double-counts every badge read. The decision is the interesting half.
#   - `acc.*.*.*.cmd.*` (door pops, output pulses) — an operator door-pop already
#     arrives as an `evt.tap` with `source="command"`, which is captured below.
#     That is the better signal: it is what actually happened, not what was asked.
#   - `acc.*.evt.fire` — the demo's fire drill runs weekly, so a demo session will
#     not see one. It is also the one subject with a different token count, so it
#     would need its own regex. Add both when you run `driver: gpio` against real
#     hardware.
#
# RUN IT
#   victoria-metrics -storageDataPath=./vmdata -retentionPeriod=30d
#   telegraf --config demo/telegraf/northwind-access.conf
#
# On Windows use TOML single quotes for paths, or forward slashes.
# =============================================================================

[agent]
  interval = "10s"           # unused: nats_consumer is a service input, not polled
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  # The Telegraf box is not the controller.
  omit_hostname = true

[global_tags]
  # A label, not part of the metric name, so one dashboard serves every tenant
  # with a variable. If tenants must not share a TSDB at all, use VictoriaMetrics
  # cluster's real multitenancy instead — its tenant id maps 1:1 onto the NATS
  # account — and drop this tag.
  org = "northwind"

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
# `outputs.http`, NOT `outputs.influxdb`, deliberately. The influxdb output always
# appends `db=<database>` to the write URL, and VictoriaMetrics turns that
# parameter into a `db="telegraf"` label on EVERY series — a constant carrying no
# information, in every Grafana legend forever. VictoriaMetrics has no databases;
# posting line protocol to /influx/write says so.
[[outputs.http]]
  url = "http://localhost:8428/influx/write"
  data_format = "influx"
  content_encoding = "gzip"
  # A 400 means a malformed batch. Retrying it forever just blocks the queue
  # behind a body that will never be accepted.
  non_retryable_statuscodes = [400]
  # `subject` has done its job in the processor below and is now a redundant
  # high-cardinality copy of location + thing_type + thing + event kind.
  tagexclude = ["subject"]
  # `ts` is carried as a string field only to keep the metric alive as far as the
  # processors — see KEEPING THE METRIC ALIVE below. Nothing downstream wants it:
  # VictoriaMetrics stores numeric field values, and the event time is already
  # the sample's timestamp. Dropped here, at the last point before the write.
  fieldexclude = ["ts"]

# =============================================================================
# INPUT — one connection, every event kind
# =============================================================================
# Wildcards, not literal subjects: add a door in the console and it appears in
# Grafana with no edit here.
#
# THREE OF THESE FOUR NEED THE CONTROLLERS RUNNING.
# `demo/rules/northwind-access.yaml` publishes taps on `….tap` and injects alarms
# on `…evt.alarm`; the decisions (`evt.tap`), the posture changes (`evt.state`)
# and the heartbeats are emitted by the four `access-controller` processes the
# demo README tells you to start. Run the scheduler alone and only
# `event_kind="alarm"` fills in — which is a correct reading of the bus, not a
# broken config, and is worth knowing before you go debugging an empty dashboard.
#
# CORE NATS, NOT JETSTREAM, DELIBERATELY. These subjects are all captured by the
# ACC_EVENTS stream, so `jetstream_subjects = [...]` would work and would survive
# a Telegraf restart without a gap. It also creates a consumer that replays the
# stream from the start on first bind — which backfills the graphs on day one and
# re-sends everything on every restart after that. Core NATS is the honest
# default for a demo: what you see is what is happening now. Switch to
# `jetstream_subjects` when losing a minute of counts during a restart matters
# more than the replay does.
[[inputs.nats_consumer]]
  name_override = "access"
  servers = ["nats://localhost:4222"]
  credentials = "/path/to/console-audit.creds"
  subjects = [
    # The decision, one per credential presentation. The workhorse.
    "acc.*.*.*.evt.tap",
    # forced, held, held_clear, intrusion, no_entry. `point` appears only on
    # intrusion alarms and names the detector; on those the `thing` tag is the
    # AREA code, not a door.
    "acc.*.*.*.evt.alarm",
    # Portal posture AND controller liveness transitions — both ride `…evt.state`
    # at six tokens, which is why the audit stream needs no second wildcard for
    # liveness. The payloads differ (`posture` on a portal, `status` on a
    # controller) so each metric carries whichever tag its payload had, and
    # `thing_type="ctrl"` tells them apart.
    "acc.*.*.*.evt.state",
    # Controller heartbeats: five tokens, outside the .evt subtree, core NATS,
    # deliberately not audited — a flood, not an event. Which makes a TSDB
    # exactly the right home for them.
    "acc.*.ctrl.*.heartbeat",
  ]
  # Only matters if you run more than one Telegraf against this account, and
  # harmless with one: it shares the load rather than doubling every count.
  queue_group = "telegraf-northwind-access"
  data_format = "json"
  # The union of every bounded string key across the four event kinds. A key
  # absent from a payload simply yields no tag. `source` is one of four
  # transports and is what keeps a physical card read forensically distinct from
  # an operator's button press. `cred` and `user` are NOT here — see the header.
  tag_keys = ["allow", "reason", "source", "type", "point", "posture", "status"]
  # Load-bearing. See KEEPING THE METRIC ALIVE below before deleting it: without
  # it this input produces nothing at all.
  json_string_fields = ["ts"]

# =============================================================================
# PROCESSORS
# =============================================================================
# Every access event is a fact with no number in it: a tap carries a reason and
# an outcome, an alarm carries a type, a controller heartbeat carries its own
# code. So each event gets a constant `count = 1` and the counting happens in the
# query (`count_over_time`) rather than in a counter here. That keeps this
# process stateless — restart Telegraf and nothing resets, because nothing was
# ever accumulating.
#
# `defaults` only fills a field that is missing or empty, so it will never
# overwrite a real value if one of these payloads grows a number later.
#
# KEEPING THE METRIC ALIVE — why the input carries `json_string_fields = ["ts"]`.
#
# A metric with no fields does not merely arrive empty: `models.RunningInput`
# drops it, in `MakeMetric`, at the INPUT — before any processor is reached. The
# JSON parser is happy to emit a fieldless metric (it has no `len(fields) == 0`
# check), so nothing logs and nothing errors. Every payload here is strings and
# bools, and `tag_keys` moves those to tags rather than fields, so without that
# line every metric is fieldless, all of them are dropped at the input,
# `defaults` is never invoked, and the whole config silently writes nothing. It
# looks exactly like a bus with no traffic on it.
#
# Parsing `ts` as a string field is the cheapest thing that gives each metric one
# field to survive on. It is junk, it is carried only far enough to reach the
# processors, and the output's `fieldexclude` drops it before the write.
#
# The general rule, worth carrying to any event-shaped input: a `defaults`
# processor cannot rescue a metric that never had a field. Something at PARSE
# time has to give it one.
#
# The `namepass` globs are not decoration: without them, a merged config that
# also carried the platform's telemetry inputs would stamp `count=1` onto
# temperature readings and mis-parse `acc.` subjects with the platform's
# four-token device pattern.
[[processors.defaults]]
  namepass = ["access"]
  [processors.defaults.fields]
    count = 1

# nats_consumer stamps every metric with a `subject` tag. One processor covers
# all four subjects: `acc.{location}.{type}.{thing}.…` for the event subtree and
# `acc.{location}.ctrl.{code}.heartbeat` for the beats, where the type slot is
# the literal `ctrl` and the thing slot is the controller code. These are the
# names subjects.go itself uses for the slots, and sharing `thing` with the
# platform's telemetry config is what lets one Grafana panel put a door's taps
# beside its site's temperature.
#
# The second block takes the last subject token as `event_kind`, which is the
# only thing separating a tap from an alarm once they share a measurement.
#
# Both use the regex processor's batch mode: when ALL capture groups are named
# and NEITHER `replacement` NOR `result_key` is given, each group becomes a tag
# named after the group. Supply either key and it quietly falls back to
# single-value mode, which is the one way to get this wrong.
[[processors.regex]]
  namepass = ["access"]
  [[processors.regex.tags]]
    key = "subject"
    pattern = '^acc\.(?P<location>[^.]+)\.(?P<thing_type>[^.]+)\.(?P<thing>[^.]+)\.'
  [[processors.regex.tags]]
    key = "subject"
    pattern = '\.(?P<event_kind>[^.]+)$'
